<!doctype html>
<meta charset="utf-8">
<title>Product — fixture</title>
<style>
  body { font:14px/1.5 system-ui, sans-serif; margin:0; color:#15171c; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:14px 22px; border-bottom:1px solid #e3e5ea; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:40px; padding:34px; max-width:1000px; }
  img { width:100%; background:#f1f3f6; border-radius:4px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .sizes { display:flex; gap:9px; margin:18px 0; }
  .sizes button { padding:9px 15px; border:1px solid #dfe2e7; background:#fff; border-radius:3px;
                  cursor:pointer; font:inherit; }
  .sizes button[aria-checked="true"] { border-color:#14171a; box-shadow:inset 0 0 0 1px #14171a; }
  .sizes button[aria-disabled="true"] { color:#b9bec7; text-decoration:line-through; cursor:not-allowed; }
  .atb { margin-top:18px; padding:14px 26px; background:#14171a; color:#fff; border:0;
         border-radius:3px; font:600 14px/1 system-ui; cursor:pointer; }
  .bag { display:flex; gap:7px; align-items:center; color:inherit; text-decoration:none; }
  .correlati { padding:0 34px 30px; }
  .correlati .tile { display:inline-block; width:130px; margin-right:14px; }
  .correlati .tile img { width:100%; height:80px; background:#f1f3f6; display:block; }
  .bag-count { background:#14171a; color:#fff; border-radius:50%; width:20px; height:20px;
               display:grid; place-items:center; font-size:11px; }
</style>

<header>
  <a href="./fixture-plp.html">← FIXTURE STORE</a>
  <a class="bag" href="./cart.html" aria-label="Shopping bag">
    <span>Bag</span><span class="bag-count" data-testid="minicart-count">0</span>
  </a>
</header>

<main>
  <img id="foto" alt="">
  <div>
    <h1 id="nome">—</h1>
    <div class="price" id="prezzo">—</div>

    <div class="sizes" role="radiogroup" aria-label="Size">
      <button role="radio" aria-checked="false">50</button>
      <button role="radio" aria-checked="false">52</button>
      <button role="radio" aria-checked="false">54</button>
      <button role="radio" aria-checked="false" aria-disabled="true">58</button>
    </div>

    <button class="atb" id="atb">Add to Bag</button>
    <p id="esito" hidden>Aggiunto.</p>
  </div>
</main>

<!-- Il carosello che ogni scheda prodotto ha, e che non è il catalogo: è la
     trappola in cui l'agente ha proposto una custodia a chi chiedeva occhiali. -->
<section class="correlati">
  <h2>Ti potrebbe piacere anche</h2>
  <div class="tile">
    <a href="./pdp.html?m=Care%20Kit&p=%2429.00" aria-label="CARE KIT"><img alt="CARE KIT" src=""></a>
    <div class="price">$29.00</div>
  </div>
  <div class="tile">
    <a href="./pdp.html?m=Cleaning%20Cloth&p=%2412.00" aria-label="CLEANING CLOTH"><img alt="CLEANING CLOTH" src=""></a>
    <div class="price">$12.00</div>
  </div>
</section>

<script>
const q = new URLSearchParams(location.search);
const nome = q.get("m") ?? "Wayfarer Classic";
const prezzo = q.get("p") ?? "$163.00";
document.getElementById("nome").textContent = nome;
document.getElementById("prezzo").textContent = prezzo;
document.title = nome;
document.getElementById("foto").src = "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="390"><rect width="520" height="390" fill="#dfe2e7"/><text x="50%" y="52%" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#6b7280">${nome}</text></svg>`);

const badge = document.querySelector(".bag-count");
badge.textContent = sessionStorage.getItem("bag") ?? "0";

for (const b of document.querySelectorAll('.sizes button')) {
  b.addEventListener("click", () => {
    if (b.getAttribute("aria-disabled") === "true") return;
    document.querySelectorAll('.sizes button').forEach(x => x.setAttribute("aria-checked", "false"));
    b.setAttribute("aria-checked", "true");
  });
}

// Come su un sito vero: senza calibro selezionata il carrello non si muove.
document.getElementById("atb").addEventListener("click", () => {
  const scelta = document.querySelector('.sizes button[aria-checked="true"]');
  if (!scelta) { alert("Seleziona una calibro"); return; }
  const n = Number(sessionStorage.getItem("bag") ?? 0) + 1;
  sessionStorage.setItem("bag", n);
  badge.textContent = n;
  document.getElementById("esito").hidden = false;
});
</script>

<script>
// Carica il livello DOM di Docty e la batteria di verifiche, ma solo con ?selftest=1.
if (new URLSearchParams(location.search).has("selftest")) {
  for (const s of ["../extension/shop-dom.js", "../extension/shop-handlers.js", "./selftest.js"]) {
    document.write(`<script src="${s}"><\/script>`);
  }
}
</script>
