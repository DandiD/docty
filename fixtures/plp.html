<!doctype html>
<meta charset="utf-8">
<title>Sunglasses — fixture</title>
<!--
  Fixture: riproduce la *struttura* tipica di una pagina di listing e-commerce
  (ancora con immagine, prezzo in un nodo fratello, griglia di card, badge del
  carrello nell'header). Non appartiene a nessun sito reale: serve a verificare le
  euristiche di shop-dom.js e a provare tutto senza rete.
-->
<style>
  body { font:14px/1.5 system-ui, sans-serif; margin:0; color:#15171c; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding:14px 22px; border-bottom:1px solid #e3e5ea; position:sticky; top:0; background:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
          gap:26px; padding:26px; }
  .tile a { text-decoration:none; color:inherit; display:block; }
  .tile img { width:100%; aspect-ratio:4/3; object-fit:cover; background:#f1f3f6; border-radius:4px; }
  .tile h3 { font-size:14px; margin:10px 0 2px; font-weight:600; }
  .price { color:#15171c; }
  .bag { display:flex; gap:7px; align-items:center; color:inherit; text-decoration:none; }
  form[role=search] { display:flex; gap:6px; }
  form[role=search] input { padding:6px 10px; border:1px solid #dfe2e7; border-radius:3px; font:inherit; }
  .bag-count { background:#14171a; color:#fff; border-radius:50%; width:20px; height:20px;
               display:grid; place-items:center; font-size:11px; }
</style>

<header>
  <strong>FIXTURE STORE</strong>
  <form role="search" action="./plp.html" method="get">
    <input type="search" name="q" placeholder="Search" aria-label="Search">
    <button type="submit">Cerca</button>
  </form>
  <a class="bag" href="./cart.html" aria-label="Shopping bag">
    <span>Bag</span><span class="bag-count" data-testid="minicart-count">0</span>
  </a>
</header>

<div class="grid" id="grid"></div>

<script>
const MODELLI = [
  ["Wayfarer Classic",        "$163.00", "Black / Green Classic G-15"],
  ["Wayfarer Folding",        "$219.00", "Black / Grey Gradient"],
  ["New Wayfarer Polarized",  "$196.00", "Tortoise / Brown"],
  ["Aviator Classic",         "$178.00", "Gold / Green"],
  ["Aviator Large Metal",     "$243.00", "Silver / Blue"],
  ["Clubmaster Classic",      "$189.00", "Black On Gold"],
  ["Round Metal",             "$203.00", "Gold / Crystal Green"],
  ["Justin Classic",          "$147.00", "Rubber Black / Grey"],
];

document.getElementById("grid").innerHTML = MODELLI.map(([nome, prezzo, colore], i) => `
  <div class="tile">
    <a href="./fixture-pdp.html?m=${encodeURIComponent(nome)}&p=${encodeURIComponent(prezzo)}"
       aria-label="${nome}">
      <img alt="${nome}" src="data:image/svg+xml,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="320" height="240" fill="#dfe2e7"/><text x="50%" y="52%" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#6b7280">${nome}</text></svg>`)}">
      <h3>${nome}</h3>
    </a>
    <div class="colore">${colore}</div>
    <div class="price">${prezzo}</div>
  </div>`).join("");
</script>

<script>
// Carica il livello DOM di Docty e la batteria di verifiche, ma solo con ?selftest=1.
if (new URLSearchParams(location.search).has("selftest")) {
  for (const s of ["../extension/shop-dom.js", "../extension/shop-handlers.js", "./selftest.js"]) {
    document.write(`<script src="${s}"><\/script>`);
  }
}
</script>
